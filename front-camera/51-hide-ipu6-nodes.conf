# Hide the IPU6's raw capture nodes from PipeWire. They can't stream on their
# own (libcamera drives them), but apps may pick one and fail with "Link has
# been severed". The camera itself is still offered through libcamera.
#
# Matches on the bus path rather than the driver name (api.v4l2.cap.driver),
# because rules are applied before the device is queried for the latter.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.bus-path = "pci-0000:00:05.0"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
